<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676"/>
      <stop offset="100%" style="stop-color:#00C853"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Transparent background (adaptive icon uses app.json backgroundColor) -->
  
  <!-- Lightning bolt centered in safe zone (66% = 675px centered) -->
  <g transform="translate(256, 176)" filter="url(#glow)">
    <!-- Bolt shape -->
    <path d="M512 0 L256 360 L384 360 L256 640 L512 280 L384 280 Z" 
          fill="url(#accent)" 
          stroke="#00E676" 
          stroke-width="6"
          stroke-linejoin="round"/>
  </g>
  
  <!-- Subtle glow rings -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="#00E676" stroke-width="2" opacity="0.2"/>
  <circle cx="512" cy="512" r="400" fill="none" stroke="#00E676" stroke-width="1" opacity="0.1"/>
</svg>
