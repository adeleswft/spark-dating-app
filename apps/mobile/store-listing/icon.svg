<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1F15"/>
      <stop offset="100%" style="stop-color:#0A0A0A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676"/>
      <stop offset="100%" style="stop-color:#00C853"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  
  <!-- Subtle gradient overlay -->
  <circle cx="256" cy="256" r="200" fill="#00E676" opacity="0.05"/>
  
  <!-- Lightning bolt -->
  <g transform="translate(128, 96)" filter="url(#glow)">
    <!-- Bolt shape -->
    <path d="M220 0 L120 180 L170 180 L100 320 L180 180 L130 180 Z" 
          fill="url(#accent)" 
          stroke="#00E676" 
          stroke-width="4"
          stroke-linejoin="round"/>
  </g>
  
  <!-- Glow effect -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00E676" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00E676" stroke-width="0.5" opacity="0.15"/>
</svg>
