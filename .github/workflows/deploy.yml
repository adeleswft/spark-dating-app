name: Deploy Spark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Test ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check API
        run: cd packages/api && npx tsc --noEmit
      - name: Type check Mobile
        run: cd apps/mobile && npx tsc --noEmit
      - name: Run API tests
        run: cd packages/api && npx tsx src/__tests__/delete-account.test.ts
      - name: Run receipt tests
        run: cd packages/api && npx tsx src/__tests__/receipt-validation.test.ts
      - name: Run email tests
        run: cd packages/api && npx tsx src/__tests__/email-service.test.ts
      - name: Run adversarial tests
        run: cd packages/api && npx tsx src/__tests__/adversarial-verify.test.ts
      - name: Run upload security tests
        run: cd packages/api && npx tsx src/__tests__/upload-security.test.ts

  # ── Deploy API to Railway ─────────────────────────────────────
  deploy-api:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: api

  # ── Deploy Web Admin to Vercel ────────────────────────────────
  deploy-web:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
