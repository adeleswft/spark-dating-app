<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    width: 1080px; height: 1920px; 
    background: linear-gradient(160deg, #0A0A0A 0%, #0D1F15 40%, #0A0A0A 100%); 
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  
  /* Confetti dots */
  .confetti { position: absolute; width: 16px; height: 16px; border-radius: 50%; }
  .c1 { top: 200px; left: 100px; background: #00E676; }
  .c2 { top: 300px; right: 150px; background: #7C4DFF; }
  .c3 { top: 400px; left: 200px; background: #FFD600; }
  .c4 { top: 250px; right: 250px; background: #FF5252; }
  .c5 { top: 350px; left: 300px; background: #00E676; }
  .c6 { bottom: 400px; left: 150px; background: #7C4DFF; }
  .c7 { bottom: 300px; right: 200px; background: #FFD600; }
  .c8 { bottom: 500px; left: 400px; background: #00E676; }
  
  /* Hearts floating */
  .heart { position: absolute; font-size: 48px; opacity: 0.6; }
  .h1 { top: 150px; left: 80px; }
  .h2 { top: 280px; right: 120px; }
  .h3 { bottom: 350px; left: 200px; }
  .h4 { bottom: 450px; right: 180px; }
  
  .match-text {
    font-size: 36px; color: #00E676; font-weight: 700;
    letter-spacing: 8px; text-transform: uppercase;
    margin-bottom: 24px;
  }
  
  .match-title {
    font-size: 96px; font-weight: 800; color: #F0F0F0;
    margin-bottom: 60px;
  }
  
  .profiles {
    display: flex; gap: 60px; align-items: center; margin-bottom: 80px;
  }
  
  .profile-circle {
    width: 280px; height: 280px; border-radius: 50%;
    border: 4px solid #00E676; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  
  .profile-circle.a { background: linear-gradient(135deg, #1B3A2A, #0D2818); }
  .profile-circle.b { background: linear-gradient(135deg, #2A1B3A, #180D28); }
  
  .profile-avatar { font-size: 120px; }
  
  .connection-line {
    width: 80px; height: 4px; background: #00E676; border-radius: 2px;
  }
  
  .ai-message {
    font-size: 32px; color: #8A8A8E; text-align: center;
    max-width: 700px; line-height: 1.5; margin-bottom: 60px;
  }
  
  .ai-message strong { color: #00E676; }
  
  .start-chat {
    background: #00E676; color: #0A0A0A;
    padding: 28px 80px; border-radius: 60px;
    font-size: 32px; font-weight: 700; border: none;
  }
  
  .later {
    color: #5A5A5E; font-size: 28px; margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="confetti c1"></div>
  <div class="confetti c2"></div>
  <div class="confetti c3"></div>
  <div class="confetti c4"></div>
  <div class="confetti c5"></div>
  <div class="confetti c6"></div>
  <div class="confetti c7"></div>
  <div class="confetti c8"></div>
  
  <div class="heart h1">💚</div>
  <div class="heart h2">💚</div>
  <div class="heart h3">💚</div>
  <div class="heart h4">💚</div>
  
  <div class="match-text">It's a Match!</div>
  <div class="match-title">💚</div>
  
  <div class="profiles">
    <div class="profile-circle a">
      <span class="profile-avatar">👤</span>
    </div>
    <div class="connection-line"></div>
    <div class="profile-circle b">
      <span class="profile-avatar">👤</span>
    </div>
  </div>
  
  <div class="ai-message">
    You and <strong>Sarah</strong> both love <strong>hiking</strong> and <strong>coffee</strong>!
    <br>AI compatibility: <strong>94%</strong>
  </div>
  
  <div class="start-chat">Start Conversation</div>
  <div class="later">Keep Swiping</div>
</body>
</html>
